<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberTrace PDF Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div class="viewer-container">
    <header class="viewer-header">
      <div class="header-left">
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="6" fill="currentColor"/>
            <path d="M8 12h16M8 16h12M8 20h8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="24" cy="20" r="4" stroke="white" stroke-width="2"/>
            <path d="M24 18v4M22 20h4" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="brand-text">CyberTrace</span>
        </div>
        <div class="document-info" id="documentInfo">
          <span class="doc-name" id="docName">Loading document...</span>
          <span class="doc-source" id="docSource"></span>
        </div>
      </div>
      <div class="header-center">
        <div class="page-nav">
          <button class="icon-btn" id="prevPage" aria-label="Previous page" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="page-input-wrapper">
            <input type="number" id="pageNumber" value="1" min="1" aria-label="Page number">
            <span class="page-separator">/</span>
            <span id="pageCount">-</span>
          </div>
          <button class="icon-btn" id="nextPage" aria-label="Next page" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <div class="header-right">
        <div class="zoom-control">
          <button class="icon-btn" id="zoomOut" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg>
          </button>
          <select id="zoomSelect" aria-label="Zoom level">
            <option value="auto">Auto</option>
            <option value="page-width">Page Width</option>
            <option value="page-fit">Page Fit</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
            <option value="3">300%</option>
            <option value="4">400%</option>
          </select>
          <button class="icon-btn" id="zoomIn" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6M11 8v6"/></svg>
          </button>
        </div>
        <button class="icon-btn" id="openSidePanel" aria-label="Open analysis panel" title="Open CyberTrace Analysis">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V6l12-6v12M17 14v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="15 14 20 9 15 4"/></svg>
        </button>
      </div>
    </header>

    <main class="viewer-main">
      <div class="sidebar" id="thumbnailSidebar" aria-label="Page thumbnails">
        <div class="sidebar-header">
          <h3>Thumbnails</h3>
          <button class="icon-btn" id="toggleSidebar" aria-label="Toggle thumbnails">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18h16M4 12h16M4 6h16"/></svg>
          </button>
        </div>
        <div class="thumbnail-list" id="thumbnailList" role="list"></div>
      </div>

      <div class="canvas-container" id="canvasContainer">
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <p id="loadingText">Initializing PDF.js...</p>
          <div class="progress-bar" id="loadingProgress" style="display: none;">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        <div class="error-overlay" id="errorOverlay" style="display: none;">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
          </svg>
          <h3 id="errorTitle">Unable to Load Document</h3>
          <p id="errorMessage"></p>
          <div class="error-actions">
            <button class="btn btn-primary" id="retryBtn">Retry</button>
            <button class="btn btn-secondary" id="manualAnalysisBtn">Manual Analysis</button>
          </div>
        </div>
        <div class="pdf-canvas-wrapper" id="pdfCanvasWrapper">
          <canvas id="pdfCanvas" aria-label="PDF page"></canvas>
        </div>
      </div>
    </main>

    <footer class="viewer-footer">
      <div class="footer-left">
        <span id="renderStatus">Ready</span>
      </div>
      <div class="footer-right">
        <span id="fileSize"></span>
        <span id="pageDimensions"></span>
      </div>
    </footer>
  </div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
